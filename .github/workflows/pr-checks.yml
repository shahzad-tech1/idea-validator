name: pr-checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy services
      - run: pytest services/verdict -q
      - run: pytest eval/retrieval -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gateway:${{ github.sha }} services/gateway
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "gateway:${{ github.sha }}"
          exit-code: "1"
          severity: "CRITICAL"

  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sLo kubeval.tar.gz https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval.tar.gz
          ./kubeval k8s/*.yaml
